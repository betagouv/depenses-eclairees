name: Publish MkDocs to GitHub Pages

on:
  push:
    branches: ["docs"]
    paths:
      - "documentation/**"
      - ".github/workflows/mkdocs-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Install Poetry
        run: pipx install poetry

      - name: Setup local virtual environment
        run: |
          poetry config virtualenvs.create true --local
          poetry config virtualenvs.in-project true --local

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: ./.venv
          key: venv-${{ runner.os }}-${{ runner.python-version }}-${{ hashFiles('poetry.lock') }}

      - name: Install Python dependencies
        run: poetry install --with dev

      - name: Build documentation
        working-directory: documentation
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          export SITE_URL="https://$REPO_OWNER.github.io/$REPO_NAME/"
          echo "Using SITE_URL=$SITE_URL"
          poetry run mkdocs build \
            --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: documentation/site

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
