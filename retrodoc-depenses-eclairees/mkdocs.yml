site_name: "Dépenses Éclairées — Rétro-documentation"
site_description: "Documentation technique du projet Dépenses Éclairées"
site_author: "Prestataire AIFE"
site_url: !ENV [SITE_URL, "https://betagouv.github.io/depenses-eclairees/"]

theme:
  name: material
  language: fr
  font: false
  palette:
    - scheme: default
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Mode sombre
    - scheme: slate
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Mode clair
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.follow
    - search.highlight
    - content.code.copy

extra_css:
  - assets/extra.css

plugins:
  - search
  - llmstxt:
      markdown_description: "Documentation technique du projet Dépenses Éclairées — Pipeline d'extraction de documents de dépenses publiques. Dépenses Éclairées automatise l'extraction et l'analyse structurée de documents gouvernementaux français via LLM (Albert/Mistral) et OCR. Stack: Django 5.2 + Celery + PostgreSQL 16 + Albert API + Tesseract."
      sections:
        Architecture:
          - architecture/vue-ensemble.md: "Vue d'ensemble et composants"
          - architecture/flux-donnees.md: "Flux de données"
          - architecture/composants.md: "Détail des composants"
          - architecture/deploiement.md: "Infrastructure Scalingo"
        Pipeline:
          - pipeline/ingestion.md: "Synchronisation Chorus/SAP"
          - pipeline/ocr-extraction.md: "OCR et extraction texte"
          - pipeline/appel-llm.md: "Appel API Albert"
          - pipeline/prompts.md: "Spécifications des prompts"
          - pipeline/parsing-reponse.md: "Validation JSON Schema"
          - pipeline/stockage.md: "Persistance des résultats"
        "Modèle de données":
          - modele-donnees/schema-base.md: "Diagramme ER"
          - modele-donnees/contrat-interface-json.md: "Structure JSON"
          - modele-donnees/champ-objet-depense.md: "Spécifications métier"
          - modele-donnees/tailles-reelles.md: "Volumétrie et distributions"
        Qualité:
          - qualite/metriques-existantes.md: "Métriques de suivi"
          - qualite/matrice-qualite.md: "Critères d'acceptation"
          - qualite/taux-remplissage.md: "Scores de confiance"
          - qualite/cas-echec.md: "Scénarios problématiques"
        Ateliers:
          - ateliers/atelier-1-connexion-llm.md: "Connexion LLM"
          - ateliers/atelier-2-extraction-qualite.md: "Extraction & Qualité"
          - ateliers/atelier-3-sizing.md: "Sizing architectes"
        "Benchmark LLMOps":
          - benchmark/index.md: "Synthèse de l'audit"
          - benchmark/01-promptops.md: "PromptOps & Versionnement"
          - benchmark/02-resilience-quotas.md: "Résilience & Quotas"
          - benchmark/03-confiance-logprobs.md: "Confiance & Logprobs"
          - benchmark/04-hallucinations-validation.md: "Hallucinations & Validation"
          - benchmark/05-observabilite.md: "Observabilité & Télémétrie"
          - benchmark/06-evaluation-continue.md: "Évaluation Continue"
          - benchmark/07-securite-conformite.md: "Sécurité & Conformité"
          - benchmark/08-finops.md: "FinOps & Coûts"
          - benchmark/09-audit-ocr.md: "Audit OCR"
          - benchmark/10-contexte-chunking.md: "Contexte & Chunking"
        "Hors-scope":
          - hors-scope/formats-non-geres.md: "Limitations actuelles"
          - hors-scope/dette-technique.md: "Code legacy"
          - hors-scope/backlog-post-juin.md: "Améliorations futures"
        Référence:
          - glossaire.md: "Glossaire métier et technique"
      full_output: llms-full.txt

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets

nav:
  - Accueil: index.md
  - Architecture:
    - Vue d'ensemble: architecture/vue-ensemble.md
    - Flux de données: architecture/flux-donnees.md
    - Composants: architecture/composants.md
    - Déploiement: architecture/deploiement.md
  - Pipeline:
    - Ingestion: pipeline/ingestion.md
    - OCR & Extraction texte: pipeline/ocr-extraction.md
    - Appel LLM (Albert): pipeline/appel-llm.md
    - Prompts: pipeline/prompts.md
    - Parsing réponse: pipeline/parsing-reponse.md
    - Stockage: pipeline/stockage.md
  - Modèle de données:
    - Schéma base: modele-donnees/schema-base.md
    - Contrat d'interface JSON: modele-donnees/contrat-interface-json.md
    - Champ "objet de la dépense": modele-donnees/champ-objet-depense.md
    - Tailles réelles: modele-donnees/tailles-reelles.md
  - Qualité:
    - Métriques existantes: qualite/metriques-existantes.md
    - Matrice qualité: qualite/matrice-qualite.md
    - Scores de confiance: qualite/taux-remplissage.md
    - Cas d'échec: qualite/cas-echec.md
  - Ateliers:
    - "Atelier 1 — Connexion LLM": ateliers/atelier-1-connexion-llm.md
    - "Atelier 2 — Extraction & Qualité": ateliers/atelier-2-extraction-qualite.md
    - "Atelier 3 — Sizing": ateliers/atelier-3-sizing.md
  - "Benchmark LLMOps":
    - "Synthèse de l'audit": benchmark/index.md
    - "PromptOps & Versionnement": benchmark/01-promptops.md
    - "Résilience & Quotas": benchmark/02-resilience-quotas.md
    - "Confiance & Logprobs": benchmark/03-confiance-logprobs.md
    - "Hallucinations & Validation": benchmark/04-hallucinations-validation.md
    - "Observabilité & Télémétrie": benchmark/05-observabilite.md
    - "Évaluation Continue": benchmark/06-evaluation-continue.md
    - "Sécurité & Conformité": benchmark/07-securite-conformite.md
    - "FinOps & Coûts": benchmark/08-finops.md
    - "Audit OCR": benchmark/09-audit-ocr.md
    - "Contexte & Chunking": benchmark/10-contexte-chunking.md
  - Hors-scope:
    - Formats non gérés: hors-scope/formats-non-geres.md
    - Dette technique: hors-scope/dette-technique.md
    - Backlog post-juin: hors-scope/backlog-post-juin.md
  - Glossaire: glossaire.md
