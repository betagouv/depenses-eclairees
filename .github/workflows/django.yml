name: Django Tests CI

on:
  push:
    branches: ['main']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: docia
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready 
          --health-interval 10s 
          --health-timeout 5s 
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt install -y --no-install-recommends $(cat Aptfile)
      - name: Install Python dependencies
        run: uv sync --locked
      - name: Setup env
        run: cp ci.env .env
      - name: Check no missing migrations
        run: uv run ./manage.py makemigrations --check --dry-run
      - name: Run ruff
        run: uv run ruff check
      - name: Run ruff format
        run: uv run ruff format --check
      - name: Run tests
        run: uv run pytest --no-migrations tests
